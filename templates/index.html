<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CodeAlpha AI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

<div class="app">


    <!-- ==========================================
         SIDEBAR
    =========================================== -->

    <aside class="sidebar">


        <!-- Logo -->

        <div class="sidebar-header">

            <div class="logo">
                🤖
            </div>

            <span>
                CodeAlpha AI
            </span>

        </div>


        <!-- New Chat -->

        <button
            id="new-chat"
            class="new-chat"
            type="button"
        >

            <span>＋</span>

            New Chat

        </button>


        <!-- Recent Chats -->

        <div class="recent-section">

            <div class="recent-title">
                Recent Chats
            </div>


            <div id="chat-history">

                <div class="no-chats">
                    No recent chats
                </div>

            </div>

        </div>


        <!-- Theme Toggle -->

        <button
            id="theme-toggle"
            class="theme-button"
            type="button"
        >

            <span id="theme-icon">
                🌙
            </span>

            <span id="theme-text">
                Dark Mode
            </span>

        </button>


    </aside>



    <!-- ==========================================
         MAIN CHAT AREA
    =========================================== -->

    <main class="main">


        <!-- Top Bar -->

        <header class="topbar">

            <div class="mobile-logo">
                🤖 CodeAlpha AI
            </div>


            <button
                id="mobile-menu"
                type="button"
            >

                ☰

            </button>

        </header>



        <!-- ==========================================
             CHAT BOX
        =========================================== -->

        <section
            id="chat-box"
            class="chat-box"
        >


            <!-- Welcome Screen -->

            <div
                id="welcome"
                class="welcome"
            >

                <div class="welcome-icon">
                    🤖
                </div>


                <h1>
                    How can I help you?
                </h1>


                <p>
                    Ask me anything — coding, studying,
                    writing, ideas and more.
                </p>


                <!-- Suggestions -->

                <div class="suggestions">


                    <button
                        type="button"
                        onclick="useSuggestion('Explain machine learning in simple words')"
                    >

                        🧠 Explain Machine Learning

                    </button>


                    <button
                        type="button"
                        onclick="useSuggestion('Write a Python program to reverse a string')"
                    >

                        💻 Help me with Python

                    </button>


                    <button
                        type="button"
                        onclick="useSuggestion('Give me some project ideas for MCA students')"
                    >

                        💡 Give me project ideas

                    </button>


                </div>

            </div>


        </section>



        <!-- ==========================================
             INPUT AREA
        =========================================== -->

        <div class="input-wrapper">


            <!-- Selected File Preview -->

            <div id="file-preview"></div>


            <!-- Input Container -->

            <div class="input-container">


                <!-- Attachment Button -->

                <button
                    id="attach-button"
                    type="button"
                    title="Attach image"
                >

                    📎

                </button>


                <!-- Hidden File Input -->

                <input
                    type="file"
                    id="file-input"
                    accept="image/*"
                    hidden
                >


                <!-- Message Input -->

                <textarea
                    id="user-input"
                    rows="1"
                    placeholder="Message CodeAlpha AI..."
                ></textarea>


                <!-- Send Button -->

                <button
                    id="send-button"
                    type="button"
                    title="Send"
                >

                    ↑

                </button>


            </div>


            <!-- Disclaimer -->

            <p class="disclaimer">

                CodeAlpha AI can make mistakes.
                Check important information.

            </p>


        </div>


    </main>


</div>



<!-- ==========================================
     JAVASCRIPT
=========================================== -->

<script
    src="{{ url_for('static', filename='script.js') }}"
></script>


</body>

</html>
